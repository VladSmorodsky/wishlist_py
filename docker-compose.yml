services:
  db:
    image: postgres:17.4
    env_file:
      - ./wishlist_project/.env
    volumes:
      - db_data:/var/lib/postgresql/data

  web:
    build: ./wishlist_project
    command: bash -c "python manage.py migrate && python manage.py runserver 0.0.0.0:9000"
    volumes:
      - ./wishlist_project:/app
    env_file:
      - ./wishlist_project/.env
    depends_on:
      - db
    ports:
      - '9000:9000'
    healthcheck:
      test: ping 0.0.0.0 -p 9000 -c 1
      interval: 60s
      timeout: 10s
      retries: 1

  redis:
    image: redis:7.4.2
    ports:
      - '6379:6379'

  web-celery:
    build: ./wishlist_project
    volumes:
      - ./wishlist_project:/app
    env_file:
      - ./wishlist_project/.env
    command: ./celery_tasks/start_celery.sh
    depends_on:
      - redis

  web-celery-beat:
    build: ./wishlist_project
    volumes:
      - ./wishlist_project:/app
    env_file:
      - ./wishlist_project/.env
    command: ./celery_tasks/start_celery_beat.sh
    depends_on:
      - redis


volumes:
  db_data: { }
